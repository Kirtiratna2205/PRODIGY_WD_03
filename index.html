<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Mode Selection -->
  <div id="modeScreen" class="screen">
    <h1>Tic Tac Toe</h1>
    <p>Choose Game Mode</p>
    <button id="friendBtn">Play with Friend</button>
    <button id="computerBtn">Play with Computer</button>
  </div>

  <!-- Game Screen -->
  <div id="gameScreen" class="screen hidden">
    <h2 id="statusText">Player X's Turn</h2>

    <div class="scoreboard">
       <div>Player X: <span id="scoreX">0</span></div>
       <div>Draws: <span id="scoreDraw">0</span></div>
       <div>Player O: <span id="scoreO">0</span></div>
    </div>

    <div class="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <button id="restartBtn">Restart Game</button>
    <button id="resetMatchBtn">Reset Match</button>

  </div>

  <script src="script.js"></script>
</body>
</html>
